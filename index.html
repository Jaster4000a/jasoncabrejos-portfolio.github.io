<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="direction.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "flagStyle": "badge",
  "showGrid": false
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <div className="v2-shell">
      <div className="v2-stage">
        {React.createElement(window.Direction, { flagStyle: tweaks.flagStyle, showGrid: tweaks.showGrid })}
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Prize highlight">
          <TweakSelect
            label="Flag style"
            value={tweaks.flagStyle}
            onChange={(v) => setTweak('flagStyle', v)}
            options={[
              { value: 'badge',  label: 'Badge (top-left)' },
              { value: 'corner', label: 'Corner solid' },
              { value: 'dot',    label: 'Subtle dot' },
              { value: 'line',   label: 'Accent line' },
            ]}
          />
          <div style={{fontSize:'0.72rem',opacity:0.65,marginTop:'0.5rem',lineHeight:1.45}}>
            Applies to every project marked as award-winning. Toggle to compare.
          </div>
        </TweakSection>
        <TweakSection title="Grid system">
          <TweakToggle
            label="Show 12-col underlay"
            value={!!tweaks.showGrid}
            onChange={(v) => setTweak('showGrid', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
